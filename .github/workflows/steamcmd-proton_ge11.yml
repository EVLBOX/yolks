name: steamcmd-proton_ge11

on:
  push:
    branches: [main]
    paths:
      - 'steamcmd/proton_enshrouded/**'
      - '.github/workflows/steamcmd-proton_ge11.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./steamcmd/proton_enshrouded
          file: ./steamcmd/proton_enshrouded/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/evlbox/steamcmd:proton_ge11
            ghcr.io/evlbox/steamcmd:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
